packages:
  - packages/*
nodeLinker: hoisted
verifyDepsBeforeRun: error
# A dependency is written at the exact version installed, and an engine a package refuses fails the install.
saveExact: true
engineStrict: true
# Node 26 is the one runtime, so its types are the only Node types, even for packages that ask for another.
overrides:
  "@types/node": "catalog:"
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
# Admit a release once it is a day old, except Effect's own packages, whose newest release the tools build on.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
# Every external dependency's one version: packages name it with catalog:, and strict mode refuses a version stated anywhere else.
catalogMode: strict
catalog:
  "@effect/platform-node": 4.1.4
  "@effect/tsgo": 0.73.2
  "@effect/vitest": 4.1.4
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  arkregex: 0.0.15
  drizzle-orm: 1.0.0-rc.5
  effect: 4.1.4
  eslint-plugin-better-tailwindcss: 4.11.0
  fallow: 3.44.0
  oxfmt: 0.79.0
  oxlint: 1.94.0
  pg: 8.23.1
  tailwindcss: 4.3.5
  tsrs: 7.1.0-beta.tsrs3
  turbo: 2.11.13
  typescript: 7.1.0-beta
  vite: 8.3.8
  vitest: 5.1.1
permissions:
  fallow:
    skills: false
