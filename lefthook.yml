# The hooks run only the pinned lefthook: without this, the generated script searches a dozen
# places for a lefthook binary and lets the commit through when it finds none.
lefthook: pnpm exec lefthook
# One check-only gate: the hooks never format or stage files, they only refuse. The commit's gate checks exactly what
# the index holds (scripts/check-staged.sh), so one lane's unfinished files never fail another's commit. A merge or
# rebase skips pre-commit, so the push runs the gate again over the working tree it pushes from.
pre-commit:
  skip:
    - merge
    - rebase
  jobs:
    - name: check
      run: sh scripts/check-staged.sh
pre-push:
  jobs:
    - name: check
      run: pnpm check
